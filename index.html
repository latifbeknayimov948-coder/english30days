const READS={"2": {"t": "A. Ponte Vecchio, Florence\nThe Ponte Vecchio is a medieval stone bridge that crosses the narrow Arno River in Florence. It was rebuilt in 1345 after a terrible flood destroyed the wooden structure that stood there before. Butchers originally sold their meat from the shops along the bridge, and the smell was extremely unpleasant. In 1593, a Medici duke ordered them to leave and gave the space to goldsmiths instead. Jewellers still work in the tiny shops today, and their windows glitter with gold and gemstones. A private corridor above the shops allowed the ruling family to cross the river without meeting ordinary citizens. During the Second World War, it was the only Florentine bridge that retreating soldiers did not destroy.\n\nB. Brooklyn Bridge, New York\nThe Brooklyn Bridge opened in 1883 and linked the cities of Manhattan and Brooklyn across the East River. At that time, it was the longest suspension bridge in the world, measuring almost two thousand metres. Its designer, John Roebling, died from an infection before construction had properly begun. His son Washington took over the project but became seriously ill from working deep inside the underwater chambers. Washington's wife, Emily, learned engineering and supervised much of the remaining work from their apartment window. Many people feared that the structure would collapse, so a circus owner marched twenty-one elephants across it. Today, around one hundred thousand vehicles and many pedestrians cross the famous bridge on a typical day.\n\nC. The Iron Bridge, England\nThe Iron Bridge spans the River Severn in Shropshire and was completed in 1779. It was the first major bridge in the world to be built entirely from cast iron. Local ironmasters wanted a crossing that would not block the busy river traffic below it. The builders copied techniques from carpentry, so many of the joints resemble those found in wooden furniture. Visitors came from all over Europe to admire this remarkable demonstration of what the new material could achieve. The nearby village grew into an important industrial centre, and historians often call the area the birthplace of industry. Because of its historical importance, the bridge is now protected as part of a World Heritage Site.\n\nD. Charles Bridge, Prague\nCharles Bridge in Prague was commissioned by King Charles IV after floods destroyed the earlier crossing. Construction began in 1357, and the work continued for more than half a century. A popular legend claims that the builders mixed eggs into the mortar to make it stronger. Scientists tested this idea recently and discovered that the mortar did contain traces of organic material. Thirty statues of saints, added mainly during the seventeenth century, line both sides of the bridge. Vehicles have been banned since 1965, so visitors can stroll freely among musicians and street painters. The bridge is particularly atmospheric at dawn, when the crowds have not yet arrived.\n\nE. Millau Viaduct, France\nThe Millau Viaduct carries a motorway across the deep valley of the River Tarn in southern France. Opened in 2004, it reaches a height of about three hundred and forty-three metres at its tallest point. That makes it taller than the Eiffel Tower, which many visitors find hard to believe. British architect Norman Foster designed the structure, and engineers built it in only three years. Its slender white pylons support steel cables that hold the road deck steady, even in strong winds. On foggy mornings, the bridge appears to float above a sea of clouds. The project cost roughly four hundred million euros, but private companies paid for it in exchange for toll income.", "q": [{"q": "Which section mentions a connection that allowed powerful people to avoid contact with the public?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section describes an experiment that partly supported an old story?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section refers to a project that was finished by someone who was not originally in charge?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a design that borrowed ideas from another craft?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section mentions a structure that is taller than a famous tower?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "The Ponte Vecchio was built before the year 1300. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Emily Roebling studied engineering. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Iron Bridge was designed by a carpenter. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Cars can drive across Charles Bridge today. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The Millau Viaduct took less than four years to build. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Brooklyn Bridge was the longest suspension bridge when it opened. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Millau Viaduct is the most expensive bridge in Europe. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "3": {"t": "A. Neuschwanstein, Germany\nNeuschwanstein Castle sits on a steep rocky hill above a village in southern Bavaria. King Ludwig II began building it in 1869 as a private retreat from public life. He admired the operas of Richard Wagner, and many rooms show scenes from those dramatic stories. The king lived there for only a few months before he died in mysterious circumstances. Soon afterwards, the government opened the unfinished palace to the public to raise money. Walt Disney's designers reportedly used its towers as inspiration for the famous fairy-tale castle in their films. More than a million people now visit each year, so tickets must be booked well in advance.\n\nB. The Alhambra, Spain\nThe Alhambra is a hilltop fortress and palace complex overlooking the city of Granada. Most of it was built in the fourteenth century by the Muslim rulers of southern Spain. Its courtyards contain reflecting pools and fountains, which keep the air pleasantly cool during hot summers. The walls are decorated with delicate carvings, colourful tiles, and passages from Arabic poetry. In 1492, the last Muslim ruler surrendered the city to the Catholic monarchs of Spain. Later, the palace was neglected, and soldiers and beggars even lived inside its famous halls. Nineteenth-century writers rediscovered its beauty, and restoration work has continued ever since.\n\nC. Himeji Castle, Japan\nHimeji Castle is often called the White Heron because its walls resemble a bird taking flight. The present buildings date from the early seventeenth century, though a fortress stood there much earlier. Its defenders designed a confusing maze of winding paths that slowed down any attacking army. Strangely, the castle never experienced a serious battle during its long and peaceful history. It survived both a devastating earthquake in 1995 and heavy bombing during the Second World War. Between 2009 and 2015, workers carefully repainted the roof tiles and cleaned the white plaster walls. UNESCO listed it in 1993 as one of the first Japanese World Heritage Sites.\n\nD. Edinburgh Castle, Scotland\nEdinburgh Castle stands on an extinct volcano that rises above the centre of the Scottish capital. People have lived on this dramatic rock for roughly three thousand years. The castle has been besieged more than twenty times, making it among the most attacked places in Britain. Inside, visitors can see the Scottish crown jewels, which are among the oldest in Europe. Every day at one o'clock, soldiers fire a cannon that can be heard across the city. The tradition began in 1861 so that ships in the harbour could set their clocks correctly. In August, the castle courtyard hosts a famous military music festival that attracts spectators from many countries.\n\nE. Ark of Bukhara, Uzbekistan\nThe Ark is a massive fortress in Bukhara, and its walls rise about twenty metres above the ground. Rulers of the city lived and governed there for more than a thousand years. The complex once contained a mosque, a treasury, a prison, and several workshops for skilled craftsmen. In 1920, the Red Army bombed the fortress, and a large fire destroyed most of the palace. Only a small part of the original interior survived the terrible attack. Today, a museum inside the walls tells the long story of the city and its people. Visitors climb a sloping ramp to the entrance, which was once guarded by two enormous towers.", "q": [{"q": "Which section mentions a building that inspired a famous entertainment company?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section describes a defensive layout intended to confuse enemies?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section refers to a daily event connected with ships?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section mentions that poor or low-status people used a place after its decline?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section describes damage caused by a modern army?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "King Ludwig II lived in Neuschwanstein for many years. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The fountains in the Alhambra help keep the air cool. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Himeji Castle was badly damaged in several battles. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The cannon at Edinburgh Castle is fired at noon. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Visitors to Edinburgh Castle are allowed to touch the crown jewels. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The Ark of Bukhara once contained a prison. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Tickets for Neuschwanstein cost less than at other German castles. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "4": {"t": "A. Hagia Sophia, Istanbul\nBuilt in 537 in less than six years, this enormous building has a dome about fifty-five metres high. It has been a church, a mosque, a museum and again a mosque. Its golden mosaics and huge dome still amaze visitors.\n\nB. Notre-Dame, Paris\nWork on this Gothic cathedral began in 1163 and continued for almost two centuries. A terrible fire in April 2019 destroyed the roof and tower. After years of careful restoration by craftspeople, it reopened to visitors in December 2024.\n\nC. Sagrada Família, Barcelona\nThe architect Antoni Gaudí took over this project in 1883 and designed towers that look like trees and mountains. He worked on it until his death in 1926. The church is still unfinished, and building work continues today.\n\nD. Sheikh Zayed Mosque, Abu Dhabi\nOpened in 2007, this white mosque has eighty-two domes and more than a thousand columns. Inside lies one of the largest hand-made carpets in the world. Thousands of workers from many countries helped to build it.\n\nE. Bibi-Khanym Mosque, Samarkand\nTimur ordered this mosque in 1399 after returning from a military campaign. It was meant to be the biggest in the Islamic world. The building was damaged by earthquakes over the centuries and was carefully restored in the twentieth century.", "q": [{"q": "Which section mentions a building that is still unfinished?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section mentions a fire in 2019?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a very large carpet?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section says a huge building was completed in under six years?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section mentions a ruler who ordered the building after a military campaign?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "The dome of Hagia Sophia is about fifty-five metres high. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Notre-Dame is in London. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Gaudí designed the Sagrada Família until he died. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}]}, "5": {"t": "A. Petra, Jordan\nThe Nabataeans carved this city into rose-red cliffs more than two thousand years ago. Clever water channels brought rain to the desert city. Western explorers only reached it in 1812, when a Swiss traveller entered in disguise.\n\nB. Pompeii, Italy\nIn 79 AD the volcano Vesuvius buried this Roman town under ash. The ash preserved streets, shops, paintings and even loaves of bread. Archaeologists have studied the site since the eighteenth century and still find new things.\n\nC. Angkor Wat, Cambodia\nBuilt in the 12th century for the Hindu god Vishnu, it later became a Buddhist temple. It is the largest religious building in the world. Its towers are so famous that they appear on the national flag.\n\nD. Itchan Kala, Khiva\nThis walled inner town in Uzbekistan contains more than fifty historical buildings and hundreds of old houses. It was the first place in the country to join the World Heritage list, in 1990. Blue tiles and a short, wide minaret are its best-known features.\n\nE. Mohenjo-daro, Pakistan\nAbout 4,500 years ago this city was home to thousands of people. Its streets were planned in a grid, and houses had drains connected to covered channels. The city was abandoned and forgotten until archaeologists found it in the 1920s.", "q": [{"q": "Which section mentions a city that was buried by a volcano?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a monument shown on a flag?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section describes buildings carved into rock?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section mentions grid streets and drains?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "Which section mentions a walled town that joined the World Heritage list in 1990?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Petra was built by the Romans. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Pompeii was buried in 79 AD. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Khiva has a famous clock tower. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "6": {"t": "A. The Great Wall of China\nDifferent rulers built and repaired this wall over about two thousand years. Together its sections stretch for thousands of kilometres. Many people believe it can be seen from space, but astronauts say this is a myth.\n\nB. Hadrian's Wall, England\nWork started in AD 122 under the Roman emperor Hadrian. The wall was about 117 kilometres long and marked the northern edge of the empire. Soldiers lived in small forts along it and watched for danger.\n\nC. The Eiffel Tower, Paris\nBuilt for the 1889 World's Fair, the tower is 330 metres high. It was supposed to be taken down after twenty years. Its usefulness as a radio antenna saved it, and today millions of people visit it.\n\nD. The Leaning Tower of Pisa\nConstruction began in 1173, but the soft ground under the tower caused it to lean after only a few years. Engineers removed soil in 2001 and made it a little straighter. It still leans by about four degrees.\n\nE. Kalyan Minaret, Bukhara\nFinished in 1127, this brick tower is about forty-six metres tall. According to legend, the conqueror Genghis Khan admired it so much that he ordered his soldiers to leave it standing. It is still one of the city's main landmarks.", "q": [{"q": "Which section mentions a temporary building that was saved by technology?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section explains a lean caused by soft ground?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section mentions the edge of the Roman Empire?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a legend about a conqueror?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "Which section mentions a common myth about space?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "The Eiffel Tower was finished in 1889. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Pisa's tower was made completely straight. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Five million people visit Pisa every year. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}};

r:{t:"A. The Pyramids of Giza\nThe Great Pyramid of Giza was built roughly forty-five centuries ago as a monumental tomb for Pharaoh Khufu. For nearly four thousand years it remained the tallest structure on Earth, rising to about one hundred and forty-six metres. Archaeologists believe that tens of thousands of skilled labourers, rather than slaves, cooperated to complete the enormous project. Each of the roughly two million limestone blocks weighs as much as a small car. Scholars still disagree about the precise methods the builders used to lift and position such heavy material. Narrow passages inside lead to several chambers, yet none of them held the treasure explorers had expected. Today it is the only one of the Seven Wonders of the Ancient World that still stands.\n\nB. The Colosseum\nThe Colosseum in Rome opened in the year eighty and could seat around fifty thousand spectators. Crowds gathered there to watch gladiator contests, wild animal hunts, and elaborate public ceremonies organised by the emperors. Its architects designed eighty numbered entrances, which allowed the entire audience to enter or leave within minutes. A huge canvas awning could be pulled across the top to protect spectators from the fierce summer sun. Beneath the wooden arena floor, a network of tunnels and lifts hid the animals and equipment. Over the centuries, earthquakes and people who removed its stone for new buildings caused severe damage. Nevertheless, roughly one third of the original structure survives, and millions of tourists admire it every year.\n\nC. The Parthenon\nThe Parthenon stands on the Acropolis, a rocky hill that overlooks the Greek capital, Athens. Construction finished in 438 BC, and the temple was dedicated to Athena, the goddess of wisdom. Its architects used subtle optical tricks, because perfectly straight lines can appear to bend when viewed from far away. For that reason, the columns lean slightly inwards and the floor curves gently upwards in the middle. Over time, the building served as a church, a mosque, and even a storage place for gunpowder. In 1687, a violent explosion destroyed the roof and many of the surrounding walls. Since then, specialists have carefully restored the monument, and the work is still continuing today.\n\nD. Machu Picchu\nMachu Picchu was constructed in the fifteenth century on a narrow ridge high in the Peruvian Andes. The Incas cut enormous stones so precisely that they fit together without any cement or mortar. This technique has helped the walls survive many powerful earthquakes in a region that shakes frequently. Farmers grew crops on carved terraces, which prevented soil from sliding down the steep mountainside. The city was abandoned about a century after it was built, and its exact purpose remains debated. It stayed hidden from the outside world until an American explorer, Hiram Bingham, publicised it in 1911. Because of heavy tourism, authorities now limit daily visitor numbers to protect the fragile ruins.\n\nE. The Registan, Samarkand\nThe Registan is a magnificent public square in Samarkand, surrounded by three imposing madrasahs. The oldest, built for the astronomer-ruler Ulugh Beg, was completed in 1420. The other two, Sher-Dor and Tilya-Kori, were added more than two centuries later, during the seventeenth century. Their facades are covered in blue, turquoise, and gold tiles arranged in intricate geometric patterns. In the past, students came from distant regions to study mathematics, astronomy, and religion there. During the twentieth century, restorers repaired cracked walls and tilted minarets to prevent further deterioration. Today it is among the most photographed landmarks in Central Asia and a symbol of Uzbekistan.",
