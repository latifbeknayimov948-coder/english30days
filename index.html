const READS={"2": {"t": "A. Ponte Vecchio, Florence\nThe Ponte Vecchio is a medieval stone bridge that crosses the narrow Arno River in Florence. It was rebuilt in 1345 after a terrible flood destroyed the wooden structure that stood there before. Butchers originally sold their meat from the shops along the bridge, and the smell was extremely unpleasant. In 1593, a Medici duke ordered them to leave and gave the space to goldsmiths instead. Jewellers still work in the tiny shops today, and their windows glitter with gold and gemstones. A private corridor above the shops allowed the ruling family to cross the river without meeting ordinary citizens. During the Second World War, it was the only Florentine bridge that retreating soldiers did not destroy.\n\nB. Brooklyn Bridge, New York\nThe Brooklyn Bridge opened in 1883 and linked the cities of Manhattan and Brooklyn across the East River. At that time, it was the longest suspension bridge in the world, measuring almost two thousand metres. Its designer, John Roebling, died from an infection before construction had properly begun. His son Washington took over the project but became seriously ill from working deep inside the underwater chambers. Washington's wife, Emily, learned engineering and supervised much of the remaining work from their apartment window. Many people feared that the structure would collapse, so a circus owner marched twenty-one elephants across it. Today, around one hundred thousand vehicles and many pedestrians cross the famous bridge on a typical day.\n\nC. The Iron Bridge, England\nThe Iron Bridge spans the River Severn in Shropshire and was completed in 1779. It was the first major bridge in the world to be built entirely from cast iron. Local ironmasters wanted a crossing that would not block the busy river traffic below it. The builders copied techniques from carpentry, so many of the joints resemble those found in wooden furniture. Visitors came from all over Europe to admire this remarkable demonstration of what the new material could achieve. The nearby village grew into an important industrial centre, and historians often call the area the birthplace of industry. Because of its historical importance, the bridge is now protected as part of a World Heritage Site.\n\nD. Charles Bridge, Prague\nCharles Bridge in Prague was commissioned by King Charles IV after floods destroyed the earlier crossing. Construction began in 1357, and the work continued for more than half a century. A popular legend claims that the builders mixed eggs into the mortar to make it stronger. Scientists tested this idea recently and discovered that the mortar did contain traces of organic material. Thirty statues of saints, added mainly during the seventeenth century, line both sides of the bridge. Vehicles have been banned since 1965, so visitors can stroll freely among musicians and street painters. The bridge is particularly atmospheric at dawn, when the crowds have not yet arrived.\n\nE. Millau Viaduct, France\nThe Millau Viaduct carries a motorway across the deep valley of the River Tarn in southern France. Opened in 2004, it reaches a height of about three hundred and forty-three metres at its tallest point. That makes it taller than the Eiffel Tower, which many visitors find hard to believe. British architect Norman Foster designed the structure, and engineers built it in only three years. Its slender white pylons support steel cables that hold the road deck steady, even in strong winds. On foggy mornings, the bridge appears to float above a sea of clouds. The project cost roughly four hundred million euros, but private companies paid for it in exchange for toll income.", "q": [{"q": "Which section mentions a connection that allowed powerful people to avoid contact with the public?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section describes an experiment that partly supported an old story?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section refers to a project that was finished by someone who was not originally in charge?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a design that borrowed ideas from another craft?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section mentions a structure that is taller than a famous tower?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "The Ponte Vecchio was built before the year 1300. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Emily Roebling studied engineering. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Iron Bridge was designed by a carpenter. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Cars can drive across Charles Bridge today. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The Millau Viaduct took less than four years to build. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Brooklyn Bridge was the longest suspension bridge when it opened. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Millau Viaduct is the most expensive bridge in Europe. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "3": {"t": "A. Neuschwanstein, Germany\nNeuschwanstein Castle sits on a steep rocky hill above a village in southern Bavaria. King Ludwig II began building it in 1869 as a private retreat from public life. He admired the operas of Richard Wagner, and many rooms show scenes from those dramatic stories. The king lived there for only a few months before he died in mysterious circumstances. Soon afterwards, the government opened the unfinished palace to the public to raise money. Walt Disney's designers reportedly used its towers as inspiration for the famous fairy-tale castle in their films. More than a million people now visit each year, so tickets must be booked well in advance.\n\nB. The Alhambra, Spain\nThe Alhambra is a hilltop fortress and palace complex overlooking the city of Granada. Most of it was built in the fourteenth century by the Muslim rulers of southern Spain. Its courtyards contain reflecting pools and fountains, which keep the air pleasantly cool during hot summers. The walls are decorated with delicate carvings, colourful tiles, and passages from Arabic poetry. In 1492, the last Muslim ruler surrendered the city to the Catholic monarchs of Spain. Later, the palace was neglected, and soldiers and beggars even lived inside its famous halls. Nineteenth-century writers rediscovered its beauty, and restoration work has continued ever since.\n\nC. Himeji Castle, Japan\nHimeji Castle is often called the White Heron because its walls resemble a bird taking flight. The present buildings date from the early seventeenth century, though a fortress stood there much earlier. Its defenders designed a confusing maze of winding paths that slowed down any attacking army. Strangely, the castle never experienced a serious battle during its long and peaceful history. It survived both a devastating earthquake in 1995 and heavy bombing during the Second World War. Between 2009 and 2015, workers carefully repainted the roof tiles and cleaned the white plaster walls. UNESCO listed it in 1993 as one of the first Japanese World Heritage Sites.\n\nD. Edinburgh Castle, Scotland\nEdinburgh Castle stands on an extinct volcano that rises above the centre of the Scottish capital. People have lived on this dramatic rock for roughly three thousand years. The castle has been besieged more than twenty times, making it among the most attacked places in Britain. Inside, visitors can see the Scottish crown jewels, which are among the oldest in Europe. Every day at one o'clock, soldiers fire a cannon that can be heard across the city. The tradition began in 1861 so that ships in the harbour could set their clocks correctly. In August, the castle courtyard hosts a famous military music festival that attracts spectators from many countries.\n\nE. Ark of Bukhara, Uzbekistan\nThe Ark is a massive fortress in Bukhara, and its walls rise about twenty metres above the ground. Rulers of the city lived and governed there for more than a thousand years. The complex once contained a mosque, a treasury, a prison, and several workshops for skilled craftsmen. In 1920, the Red Army bombed the fortress, and a large fire destroyed most of the palace. Only a small part of the original interior survived the terrible attack. Today, a museum inside the walls tells the long story of the city and its people. Visitors climb a sloping ramp to the entrance, which was once guarded by two enormous towers.", "q": [{"q": "Which section mentions a building that inspired a famous entertainment company?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section describes a defensive layout intended to confuse enemies?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section refers to a daily event connected with ships?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section mentions that poor or low-status people used a place after its decline?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section describes damage caused by a modern army?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "King Ludwig II lived in Neuschwanstein for many years. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The fountains in the Alhambra help keep the air cool. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Himeji Castle was badly damaged in several battles. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The cannon at Edinburgh Castle is fired at noon. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Visitors to Edinburgh Castle are allowed to touch the crown jewels. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The Ark of Bukhara once contained a prison. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Tickets for Neuschwanstein cost less than at other German castles. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "4": {"t": "A. Hagia Sophia, Istanbul\nBuilt in 537 in less than six years, this enormous building has a dome about fifty-five metres high. It has been a church, a mosque, a museum and again a mosque. Its golden mosaics and huge dome still amaze visitors.\n\nB. Notre-Dame, Paris\nWork on this Gothic cathedral began in 1163 and continued for almost two centuries. A terrible fire in April 2019 destroyed the roof and tower. After years of careful restoration by craftspeople, it reopened to visitors in December 2024.\n\nC. Sagrada Família, Barcelona\nThe architect Antoni Gaudí took over this project in 1883 and designed towers that look like trees and mountains. He worked on it until his death in 1926. The church is still unfinished, and building work continues today.\n\nD. Sheikh Zayed Mosque, Abu Dhabi\nOpened in 2007, this white mosque has eighty-two domes and more than a thousand columns. Inside lies one of the largest hand-made carpets in the world. Thousands of workers from many countries helped to build it.\n\nE. Bibi-Khanym Mosque, Samarkand\nTimur ordered this mosque in 1399 after returning from a military campaign. It was meant to be the biggest in the Islamic world. The building was damaged by earthquakes over the centuries and was carefully restored in the twentieth century.", "q": [{"q": "Which section mentions a building that is still unfinished?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section mentions a fire in 2019?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a very large carpet?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section says a huge building was completed in under six years?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section mentions a ruler who ordered the building after a military campaign?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "The dome of Hagia Sophia is about fifty-five metres high. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Notre-Dame is in London. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Gaudí designed the Sagrada Família until he died. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}]}, "5": {"t": "A. Petra, Jordan\nThe Nabataeans carved this city into rose-red cliffs more than two thousand years ago. Clever water channels brought rain to the desert city. Western explorers only reached it in 1812, when a Swiss traveller entered in disguise.\n\nB. Pompeii, Italy\nIn 79 AD the volcano Vesuvius buried this Roman town under ash. The ash preserved streets, shops, paintings and even loaves of bread. Archaeologists have studied the site since the eighteenth century and still find new things.\n\nC. Angkor Wat, Cambodia\nBuilt in the 12th century for the Hindu god Vishnu, it later became a Buddhist temple. It is the largest religious building in the world. Its towers are so famous that they appear on the national flag.\n\nD. Itchan Kala, Khiva\nThis walled inner town in Uzbekistan contains more than fifty historical buildings and hundreds of old houses. It was the first place in the country to join the World Heritage list, in 1990. Blue tiles and a short, wide minaret are its best-known features.\n\nE. Mohenjo-daro, Pakistan\nAbout 4,500 years ago this city was home to thousands of people. Its streets were planned in a grid, and houses had drains connected to covered channels. The city was abandoned and forgotten until archaeologists found it in the 1920s.", "q": [{"q": "Which section mentions a city that was buried by a volcano?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a monument shown on a flag?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section describes buildings carved into rock?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "Which section mentions grid streets and drains?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "Which section mentions a walled town that joined the World Heritage list in 1990?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Petra was built by the Romans. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Pompeii was buried in 79 AD. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Khiva has a famous clock tower. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "6": {"t": "A. The Great Wall of China\nDifferent rulers built and repaired this wall over about two thousand years. Together its sections stretch for thousands of kilometres. Many people believe it can be seen from space, but astronauts say this is a myth.\n\nB. Hadrian's Wall, England\nWork started in AD 122 under the Roman emperor Hadrian. The wall was about 117 kilometres long and marked the northern edge of the empire. Soldiers lived in small forts along it and watched for danger.\n\nC. The Eiffel Tower, Paris\nBuilt for the 1889 World's Fair, the tower is 330 metres high. It was supposed to be taken down after twenty years. Its usefulness as a radio antenna saved it, and today millions of people visit it.\n\nD. The Leaning Tower of Pisa\nConstruction began in 1173, but the soft ground under the tower caused it to lean after only a few years. Engineers removed soil in 2001 and made it a little straighter. It still leans by about four degrees.\n\nE. Kalyan Minaret, Bukhara\nFinished in 1127, this brick tower is about forty-six metres tall. According to legend, the conqueror Genghis Khan admired it so much that he ordered his soldiers to leave it standing. It is still one of the city's main landmarks.", "q": [{"q": "Which section mentions a temporary building that was saved by technology?", "o": ["A", "B", "C", "D", "E"], "a": "C"}, {"q": "Which section explains a lean caused by soft ground?", "o": ["A", "B", "C", "D", "E"], "a": "D"}, {"q": "Which section mentions the edge of the Roman Empire?", "o": ["A", "B", "C", "D", "E"], "a": "B"}, {"q": "Which section mentions a legend about a conqueror?", "o": ["A", "B", "C", "D", "E"], "a": "E"}, {"q": "Which section mentions a common myth about space?", "o": ["A", "B", "C", "D", "E"], "a": "A"}, {"q": "The Eiffel Tower was finished in 1889. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Pisa's tower was made completely straight. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Five million people visit Pisa every year. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}};

r:{t:"A. The Pyramids of Giza\nThe Great Pyramid of Giza was built roughly forty-five centuries ago as a monumental tomb for Pharaoh Khufu. For nearly four thousand years it remained the tallest structure on Earth, rising to about one hundred and forty-six metres. Archaeologists believe that tens of thousands of skilled labourers, rather than slaves, cooperated to complete the enormous project. Each of the roughly two million limestone blocks weighs as much as a small car. Scholars still disagree about the precise methods the builders used to lift and position such heavy material. Narrow passages inside lead to several chambers, yet none of them held the treasure explorers had expected. Today it is the only one of the Seven Wonders of the Ancient World that still stands.\n\nB. The Colosseum\nThe Colosseum in Rome opened in the year eighty and could seat around fifty thousand spectators. Crowds gathered there to watch gladiator contests, wild animal hunts, and elaborate public ceremonies organised by the emperors. Its architects designed eighty numbered entrances, which allowed the entire audience to enter or leave within minutes. A huge canvas awning could be pulled across the top to protect spectators from the fierce summer sun. Beneath the wooden arena floor, a network of tunnels and lifts hid the animals and equipment. Over the centuries, earthquakes and people who removed its stone for new buildings caused severe damage. Nevertheless, roughly one third of the original structure survives, and millions of tourists admire it every year.\n\nC. The Parthenon\nThe Parthenon stands on the Acropolis, a rocky hill that overlooks the Greek capital, Athens. Construction finished in 438 BC, and the temple was dedicated to Athena, the goddess of wisdom. Its architects used subtle optical tricks, because perfectly straight lines can appear to bend when viewed from far away. For that reason, the columns lean slightly inwards and the floor curves gently upwards in the middle. Over time, the building served as a church, a mosque, and even a storage place for gunpowder. In 1687, a violent explosion destroyed the roof and many of the surrounding walls. Since then, specialists have carefully restored the monument, and the work is still continuing today.\n\nD. Machu Picchu\nMachu Picchu was constructed in the fifteenth century on a narrow ridge high in the Peruvian Andes. The Incas cut enormous stones so precisely that they fit together without any cement or mortar. This technique has helped the walls survive many powerful earthquakes in a region that shakes frequently. Farmers grew crops on carved terraces, which prevented soil from sliding down the steep mountainside. The city was abandoned about a century after it was built, and its exact purpose remains debated. It stayed hidden from the outside world until an American explorer, Hiram Bingham, publicised it in 1911. Because of heavy tourism, authorities now limit daily visitor numbers to protect the fragile ruins.\n\nE. The Registan, Samarkand\nThe Registan is a magnificent public square in Samarkand, surrounded by three imposing madrasahs. The oldest, built for the astronomer-ruler Ulugh Beg, was completed in 1420. The other two, Sher-Dor and Tilya-Kori, were added more than two centuries later, during the seventeenth century. Their facades are covered in blue, turquoise, and gold tiles arranged in intricate geometric patterns. In the past, students came from distant regions to study mathematics, astronomy, and religion there. During the twentieth century, restorers repaired cracked walls and tilted minarets to prevent further deterioration. Today it is among the most photographed landmarks in Central Asia and a symbol of Uzbekistan.",

sh:{t:"My grandmother is eighty-two years old, but she remembers every birthday in our family. She does not use a phone or an app. She has a small red notebook. Every morning she checks the date, and if it is someone's birthday, she calls before seven a.m. Once she called my cousin in Germany at six in the morning and forgot the time difference. My cousin was not happy, but we all love it, because someone always remembers us.",

for(const k in DATA)delete DATA[k];for(const k in READS)delete READS[k];const NEW={"1": {"v": [["bazaar", "bozor", "The bazaar opens at six."], ["stall", "peshtaxta", "Her stall sells apricots."], ["seller", "sotuvchi", "The seller smiled at me."], ["customer", "xaridor", "Every customer gets a bag."], ["fresh", "yangi", "The bread is fresh."], ["price", "narx", "What is the price?"], ["cheap", "arzon", "Onions are cheap today."], ["expensive", "qimmat", "Honey is expensive."], ["bargain", "savdolashmoq", "My mother likes to bargain."], ["weigh", "tortmoq", "He weighs the fruit."], ["kilo", "kilogramm", "I need two kilos of rice."], ["basket", "savat", "She carries a basket."], ["bag", "xalta; sumka", "Put it in the bag."], ["change", "qaytim", "Here is your change."], ["coin", "tanga", "I found a coin."], ["bread", "non", "The bread is still warm."], ["spice", "ziravor", "This spice is hot."], ["apricot", "o‘rik", "Apricots are sweet in summer."], ["honey", "asal", "We buy honey in autumn."], ["crowded", "gavjum", "The bazaar is crowded."]], "r": {"t": "A. The Early Morning\nThe old bazaar opens before sunrise. Sellers arrive with trucks full of fruit and vegetables. They build their stalls quickly and put the best apricots at the front. By six o’clock the first customers are already walking between the tables.\n\nB. Bread and Spices\nThe bread seller bakes round loaves in a clay oven. The smell travels across the whole market. Next to him, a woman sells spices in tall paper bags. She lets customers taste a little before they buy.\n\nC. The Art of Bargaining\nPrices are never fixed in the bazaar. A customer asks about the price, and the seller gives a high number. Then the customer offers less, and both of them smile. After a short talk they agree on a fair price and shake hands.\n\nD. Why People Love It\nSupermarkets are clean and fast, but the bazaar has something special. People talk, joke and share news with the sellers. Many families have bought from the same stall for twenty years. For them, shopping here is a tradition, not just a job.", "q": [{"q": "Which section explains how buyers and sellers agree on a price?", "o": ["A", "B", "C", "D"], "a": "C"}, {"q": "Which section mentions a clay oven?", "o": ["A", "B", "C", "D"], "a": "B"}, {"q": "Which section says families buy from the same stall for years?", "o": ["A", "B", "C", "D"], "a": "D"}, {"q": "Sellers arrive after sunrise. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The spice seller lets customers taste before they buy. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The bazaar has more than a hundred stalls. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "l": {"s": ["A: Good morning! How much are the apricots?", "B: Eight thousand soms a kilo. They are very fresh.", "A: That is a bit expensive. Can you make it seven?", "B: For you, seven and a half.", "A: Okay. Two kilos, please.", "B: Anything else? We have honey too.", "A: No, thank you. Here is twenty thousand.", "B: Your change is five thousand. Have a nice day!"], "q": [{"q": "What is the first price per kilo?", "o": ["6,000", "8,000", "9,000"], "a": "8,000"}, {"q": "What is the final price per kilo?", "o": ["7,500", "7,000", "8,000"], "a": "7,500"}, {"q": "How many kilos does the customer buy?", "o": ["One", "Two", "Three"], "a": "Two"}, {"q": "How much change does the customer get?", "o": ["Five thousand", "Ten thousand", "Two thousand"], "a": "Five thousand"}]}, "sh": {"t": "I go to the bazaar with my mother every Saturday. We buy fresh fruit and warm bread. The sellers know us well and always smile. My mother bargains for a lower price. I carry the heavy bags home.", "q": [{"q": "When do they go to the bazaar?", "o": ["On Saturday", "On Monday", "Every night"], "a": "On Saturday"}, {"q": "Who goes with the speaker?", "o": ["Mother", "Brother", "Teacher"], "a": "Mother"}, {"q": "Who carries the bags?", "o": ["The speaker", "The seller", "Father"], "a": "The speaker"}]}, "s1": ["Do you like shopping at markets?", "Who does the shopping in your family?", "What do you usually buy?", "Do you prefer markets or supermarkets?", "Do you ever bargain?"], "s2": ["Describe a market you visited. Say where it is, what you saw, and why you remember it.", "Describe something you bought recently. Say what it was, where you bought it, and why you chose it."]}, "2": {"v": [["train", "poyezd", "The train is fast."], ["station", "vokzal", "We met at the station."], ["platform", "perron", "The train leaves from platform four."], ["ticket", "chipta", "I bought two tickets."], ["carriage", "vagon", "Our carriage is at the front."], ["seat", "o‘rindiq", "I have a window seat."], ["window", "deraza", "Open the window, please."], ["passenger", "yo‘lovchi", "Every passenger has a ticket."], ["conductor", "konduktor", "The conductor checks tickets."], ["luggage", "yuk", "Put your luggage here."], ["suitcase", "chamadon", "My suitcase is heavy."], ["departure", "jo‘nab ketish", "Departure is at eight."], ["arrival", "yetib kelish", "Arrival is at noon."], ["delay", "kechikish", "There is a short delay."], ["timetable", "jadval", "Check the timetable."], ["journey", "safar", "The journey was long."], ["tunnel", "tunnel", "The train enters a tunnel."], ["speed", "tezlik", "The speed is high."], ["fast", "tez", "This train is fast."], ["comfortable", "qulay", "The seats are comfortable."]], "r": {"t": "A. The Platform\nThe station is busy an hour before departure. Passengers carry suitcases and check the board for their platform number. A voice announces every delay and arrival. Children run along the platform while parents hold the tickets.\n\nB. Inside the Carriage\nEach carriage has rows of soft seats and large windows. A conductor walks through and checks every ticket. Some passengers read, others sleep or eat sandwiches. A small table by the window holds tea and fruit.\n\nC. The View\nThe train crosses wide fields and passes through a long tunnel. For a few seconds everything is dark, then bright again. Far away, mountains appear with snow on top. Many travellers take photos of the landscape.\n\nD. Arrival\nAfter six hours the train slows down and enters the new city. Passengers collect their bags and wait by the doors. Taxi drivers shout offers outside the station. Tired but happy, the travellers step onto the platform.", "q": [{"q": "Which section says a conductor checks tickets?", "o": ["A", "B", "C", "D"], "a": "B"}, {"q": "Which section mentions a tunnel?", "o": ["A", "B", "C", "D"], "a": "C"}, {"q": "Which section describes taxi drivers outside the station?", "o": ["A", "B", "C", "D"], "a": "D"}, {"q": "The journey takes six hours. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Passengers cannot eat on the train. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The train has a restaurant carriage. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "l": {"s": ["A: Hello, I need a ticket to Samarkand for tomorrow.", "B: There is a train at eight in the morning and one at two in the afternoon.", "A: The morning one, please. How long is the journey?", "B: About two and a half hours.", "A: How much is a seat?", "B: A second-class seat is one hundred thousand soms.", "A: I will take two tickets, please.", "B: Your platform is number four. The train leaves at eight sharp."], "q": [{"q": "Where does the customer want to go?", "o": ["Bukhara", "Samarkand", "Khiva"], "a": "Samarkand"}, {"q": "Which train does the customer choose?", "o": ["The morning train", "The afternoon train", "The night train"], "a": "The morning train"}, {"q": "How much is one seat?", "o": ["50,000", "100,000", "200,000"], "a": "100,000"}, {"q": "Which platform is the train on?", "o": ["Two", "Four", "Six"], "a": "Four"}]}, "sh": {"t": "I love travelling by train. I always take a window seat and watch the fields go by. The journey is long, but I never feel bored. I read a book and drink hot tea. Trains are slow, but they are comfortable.", "q": [{"q": "Which seat does the speaker take?", "o": ["A window seat", "An aisle seat", "A back seat"], "a": "A window seat"}, {"q": "What does the speaker drink?", "o": ["Coffee", "Hot tea", "Juice"], "a": "Hot tea"}, {"q": "How are trains described?", "o": ["Comfortable", "Dangerous", "Cheap"], "a": "Comfortable"}]}, "s1": ["Do you like travelling by train?", "How do you usually travel to other cities?", "Do you prefer a window seat?", "What do you do on long journeys?", "Is public transport good where you live?"], "s2": ["Describe a long journey you made. Say where you went, how you travelled, and how you felt.", "Describe a railway or bus station you know. Say where it is, what it looks like, and what happens there."]}, "3": {"v": [["friend", "do‘st", "She is my friend."], ["best friend", "eng yaqin do‘st", "Aziz is my best friend."], ["kind", "mehribon", "He is kind to everyone."], ["honest", "rostgo‘y", "An honest friend tells the truth."], ["funny", "kulgili", "My friend is very funny."], ["loyal", "sodiq", "A loyal friend never leaves you."], ["shy", "uyatchan", "I was shy at school."], ["clever", "aqlli", "She is clever and quick."], ["helpful", "yordam beradigan", "He is always helpful."], ["trust", "ishonmoq", "I trust my friend."], ["secret", "sir", "Keep it a secret."], ["share", "bo‘lishmoq", "We share our lunch."], ["laugh", "kulmoq", "We laugh a lot."], ["argue", "talashmoq", "We never argue for long."], ["forgive", "kechirmoq", "Please forgive me."], ["meet", "uchrashmoq", "We meet on Fridays."], ["know", "bilmoq; tanimoq", "I know him well."], ["miss", "sog‘inmoq", "I miss my friend."], ["together", "birga", "We study together."], ["support", "qo‘llab-quvvatlamoq", "Friends support each other."]], "r": {"t": "A. How We Met\nI met my best friend, Aziz, in the first year of school. We sat at the same desk and shared one pencil. At first we did not talk much because we were both shy. A funny mistake by the teacher made us laugh, and we became friends that day.\n\nB. What He Is Like\nAziz is kind, honest and always ready to help. He makes people laugh with his silly jokes. When I am sad, he listens carefully and never judges me. He also keeps every secret I tell him.\n\nC. Our Time Together\nEvery Friday we play football in the yard near my house. On weekends we ride bicycles to the river. Sometimes we only sit and talk for hours. Time passes quickly when we are together.\n\nD. A Difficult Moment\nOnce we argued about a silly game and did not speak for a week. I felt terrible and missed him every day. Finally, he came to my door and said sorry first. Since then, we always solve problems by talking.", "q": [{"q": "Which section describes how the friends met?", "o": ["A", "B", "C", "D"], "a": "A"}, {"q": "Which section says he keeps secrets?", "o": ["A", "B", "C", "D"], "a": "B"}, {"q": "Which section describes an argument?", "o": ["A", "B", "C", "D"], "a": "D"}, {"q": "They met at university. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "They did not speak for a week after the argument. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Aziz lives in another city. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}]}, "l": {"s": ["A: Hi Dilya! What are you doing on Saturday?", "B: Nothing special. Do you want to meet?", "A: Yes! Let us go to the new park near the river.", "B: Good idea. What time shall we meet?", "A: At ten o’clock, in front of the cinema.", "B: Can I bring my brother? He is very funny.", "A: Of course. I will bring sandwiches and juice.", "B: Perfect. I will bring a ball. See you on Saturday!"], "q": [{"q": "Where will they go?", "o": ["To the cinema", "To a park near the river", "To a shop"], "a": a", "Play cards."], ["puzzle", "boshqotirma", "A hard puzzle."], ["chess", "shaxmat", "Play chess."], ["draw", "chizmoq", "I draw pictures."], ["paint", "bo‘yamoq", "She paints flowers."], ["bake", "pishirmoq", "We bake biscuits."], ["cook", "ovqat tayyorlamoq", "I cook lunch."], ["clean", "tozalamoq", "Clean the room."], ["tidy", "tartibga solmoq", "Tidy your desk."], ["wash", "yuvmoq", "Wash the dishes."], ["laundry", "kir", "Do the laundry."], ["iron", "dazmollamoq", "Iron the shirt."], ["nap", "mudrab olmoq", "Take a nap."], ["relax", "dam olmoq", "Relax at home."], ["boring", "zerikarli", "A boring day."], ["bored", "zerikkan", "I am bored."], ["lazy", "dangasa", "A lazy Sunday."], ["quiet", "tinch", "A quiet house."], ["slow", "sekin", "A slow morning."], ["stay in", "uyda qolmoq", "We stay in."], ["stay home", "uyda o‘tirmoq", "Stay home today."], ["call", "qo‘ng‘iroq qilmoq", "Call me later."], ["text", "xabar yozmoq", "Text your friend."], ["message", "xabar", "Send a message."], ["chat", "suhbatlashmoq", "Let us chat."], ["plan", "reja", "Change the plan."], ["cancel", "bekor qilmoq", "Cancel the trip."], ["postpone", "keyinga surmoq", "Postpone the game."], ["weekend", "dam olish kunlari", "Happy weekend!"], ["Saturday", "shanba", "On Saturday."], ["Sunday", "yakshanba", "On Sunday."], ["indoors", "uy ichida", "Play indoors."], ["outdoors", "tashqarida", "Play outdoors."], ["mud", "loy", "Mud on my shoes."], ["flood", "toshqin", "A flood in the street."], ["forecast", "bashorat", "Check the forecast."], ["hope", "umid qilmoq", "I hope it stops."], ["rainbow", "kamalak", "A rainbow appeared."], ["sigh", "xo‘rsinmoq", "He sighed."], ["suggest", "taklif qilmoq", "She suggested a film."], ["calm", "sokin", "A calm evening."]], "r": {"t": "A. A Grey Morning\nOn Saturday morning, heavy rain falls on the city. Dark clouds cover the sky and the wind shakes the trees. Amir was going to play football with his friends. He looks out of the window and sighs, because the pitch is full of puddles.\n\nB. Plans Change\nHis sister suggests staying home and having a family day. Their mother makes hot soup and a big pot of tea. Father brings out an old box of board games from the cupboard. Soon the living room feels warm and cosy.\n\nC. Games and Stories\nThey play chess, cards and a difficult puzzle with a thousand pieces. Grandfather tells funny stories about rainy days in his childhood. The children laugh so loudly that the neighbours knock on the door. By noon, nobody remembers the football match.\n\nD. The Evening\nIn the afternoon the rain stops and a small rainbow appears. Amir and his sister go outside in their boots and jump in puddles. When they return, their clothes are wet but their faces are happy. That night Amir decides that rainy days are not so bad.", "q": [{"q": "Which section mentions a rainbow?", "o": ["A", "B", "C", "D"], "a": "D"}, {"q": "Which section describes grandfather’s stories?", "o": ["A", "B", "C", "D"], "a": "C"}, {"q": "Which section says the football pitch was full of puddles?", "o": ["A", "B", "C", "D"], "a": "A"}, {"q": "Amir wanted to play football. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The family watched a film together. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The rain continued all day. (True / False / Not given)", "o": ["True", "False", "Not given"], "a": "False"}]}, "l": {"s": ["A: Hi Nodira, it is raining so hard. Are we still going to the park?", "B: I don’t think so. The forecast says it will rain until the evening.", "A: What a pity. Shall we meet at my house instead?", "B: Good idea. What shall we do there?", "A: We can bake biscuits and watch a film.", "B: Lovely. I will bring my laptop and some tea.", "A: Come at three. Don’t forget your umbrella!", "B: See you at three."], "q": [{"q": "What is the weather like?", "o": ["Sunny", "Raining hard", "Snowing"], "a": "Raining hard"}, {"q": "Where will they meet?", "o": ["At the park", "At A’s house", "At school"], "a": "At A’s house"}, {"q": "What will they bake?", "o": ["Bread", "Biscuits", "A cake"], "a": "Biscuits"}, {"q": "What time will they meet?", "o": ["Two", "Three", "Four"], "a": "Three"}]}, "sh": {"t": "I love rainy weekends. I stay at home in warm socks. I drink hot tea and read a good book. The sound of rain is calming. In the evening I watch a film with my family.", "q": [{"q": "What does the speaker drink?", "o": ["Hot tea", "Cold juice", "Coffee"], "a": "Hot tea"}, {"q": "How is the sound of rain described?", "o": ["Calming", "Scary", "Boring"], "a": "Calming"}, {"q": "What do they do in the evening?", "o": ["Watch a film", "Go shopping", "Play football"], "a": "Watch a film"}]}, "s1": ["Do you like rainy days?", "What do you do when it rains?", "Do you prefer staying in or going out?", "What is your ideal weekend?", "Do you read or watch films at home?"], "s2": ["Describe a rainy day you remember. Say when it was, what you did, and how you felt.", "Describe a perfect weekend. Say where you are, who you are with, and what you do."]}};for(const k in NEW2){const d=NEW2[k];DATA[k]={v:d.v,r:d.r,l:d.l,sh:d.sh,s1:d.s1,s2:d.s2}}

{const d=DATA[1];d.r={t:"A. Before Sunrise\nLong before the sun rises, the old bazaar begins to wake up. Trucks arrive from nearby villages with boxes of apricots, melons and cabbages. The sellers work quickly because the best customers come early. They arrange the fruit in careful pyramids so that it looks fresh and colourful. By six o’clock the narrow lanes are already full of voices.\n\nB. A Short History\nBazaars have been the heart of Central Asian cities for more than two thousand years. Merchants once travelled across deserts with camels carrying silk, spices and paper. They stopped in market towns to rest, exchange news and sell their goods. Many of today’s bazaars stand on the same ground as those ancient trading places. The names of the lanes still remind visitors of the crafts that once lived there.\n\nC. Food and Smells\nThe smell of fresh bread reaches every corner of the market. Bakers pull round loaves from clay ovens and sell them while they are still hot. Nearby, a woman weighs dried fruit, nuts and several kinds of spice on an old scale. Customers are invited to taste a small piece before they decide to buy. Honey sellers keep jars open so that people can try the different flavours.\n\nD. The Craft Section\nAt the back of the bazaar there is a quiet corner for craftsmen. Potters sell blue ceramic bowls decorated with traditional patterns. Other stalls offer silk scarves, wooden boxes and small handmade knives. Tourists often buy these items as souvenirs for their families. A young potter says that visitors are surprised to see how much work each bowl needs.\n\nE. The Art of Bargaining\nPrices in the bazaar are rarely fixed, so bargaining is part of the shopping experience. The customer asks the price, and the seller names a high figure with a smile. The buyer then offers much less, and the two of them begin a friendly discussion. Usually they agree on a price in the middle, and both feel that they have won. Experienced shoppers say that patience is the most useful skill.\n\nF. Changes in Modern Times\nIn recent years, supermarkets have opened in almost every neighbourhood. Some people think that the old bazaars will slowly disappear. However, many families still prefer the fresh produce and the lower prices they find there. The city has also repaired the roofs and added clean toilets to attract visitors. As a result, the number of tourists has grown every year.\n\nG. Why It Matters\nFor many people the bazaar is more than a place to buy food. Sellers know their customers by name and often ask about their children. Friends meet by chance in the lanes and stop to talk for a while. This warm social life is difficult to find in a large shop. Because of it, the bazaar remains the living heart of the city.",q:[{"q": "Sellers arrive at the bazaar after sunrise.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Merchants once brought silk and spices across deserts.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Customers are not allowed to taste food before buying.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Tourists buy handmade items as souvenirs.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The young potter learned his skill from his father.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Bargaining usually ends with a price somewhere in the middle.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The bazaar has more than five hundred stalls.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Sellers arrange the fruit in careful ______ so that it looks fresh.", "a": "pyramids"}, {"q": "Bakers pull round loaves from clay ______.", "a": "ovens"}, {"q": "Potters sell blue ceramic bowls decorated with traditional ______.", "a": "patterns"}, {"q": "Experienced shoppers say that ______ is the most useful skill.", "a": "patience"}, {"q": "The city repaired the ______ to attract visitors.", "a": "roofs"}, {"q": "Sellers often ask customers about their ______.", "a": "children"}]};d.l={"s": ["A: Excuse me, how much is this blue bowl?", "B: It is handmade, so it costs sixty thousand soms.", "A: That is quite expensive. Can you give me a discount?", "B: For you, fifty thousand. It is real ceramic from Rishtan.", "A: Lovely. I will take two, and one silk scarf too.", "B: The scarf is forty thousand. Altogether, one hundred and forty thousand.", "A: Could you make it one hundred and thirty?", "B: Okay, one hundred and thirty. Would you like a bag?", "A: Yes, please. By the way, where can I buy fresh bread?", "B: Go straight past the spice stalls and turn left at the fountain.", "A: Is it open on Fridays?", "B: Yes, from six in the morning until noon.", "A: Thank you so much!", "B: You are welcome. Enjoy the bazaar!"], "q": [{"q": "The bowl is ______, so it costs sixty thousand soms.", "a": "handmade"}, {"q": "The bowls come from ______.", "a": "Rishtan"}, {"q": "The customer also wants a silk ______.", "a": "scarf"}, {"q": "The final price is one hundred and ______ thousand.", "a": "thirty"}, {"q": "To find bread, turn left at the ______.", "a": "fountain"}, {"q": "The bread shop is open from six in the morning until ______.", "a": "noon"}, {"q": "How many bowls does the customer buy?", "o": ["One", "Two", "Three"], "a": "Two"}, {"q": "How much is the scarf?", "o": ["30,000", "40,000", "50,000"], "a": "40,000"}, {"q": "What does the customer ask for?", "o": ["A discount", "A map", "A guide"], "a": "A discount"}, {"q": "On which day does the customer ask about opening?", "o": ["Monday", "Friday", "Sunday"], "a": "Friday"}]};d.sh={"t": "Every Saturday I go to the old bazaar with my mother. We leave home early because the best fruit is sold in the morning. First, we visit the bread seller, and the warm smell makes me hungry. Then my mother checks the apricots carefully and asks about the price. The seller says it is eight thousand, but she offers six. After a short talk, they agree on seven, and everybody smiles. I carry the heavy bags while she buys honey, nuts and spices. Sometimes we stop at a small stall and drink green tea. The old woman there always asks about my school. At noon we return home tired but happy. I think that the bazaar teaches me patience and kindness. When I grow up, I want to bring my own children here.", "q": [{"q": "When do they go to the bazaar?", "o": ["Every Saturday", "Every Friday", "Every Monday"], "a": "Every Saturday"}, {"q": "Why do they leave early?", "o": ["The best fruit is sold in the morning", "It is cheaper at night", "The bazaar closes soon"], "a": "The best fruit is sold in the morning"}, {"q": "What makes the speaker hungry?", "o": ["The smell of warm bread", "The honey", "The tea"], "a": "The smell of warm bread"}, {"q": "What price do they agree on for the apricots?", "o": ["Six thousand", "Seven thousand", "Eight thousand"], "a": "Seven thousand"}, {"q": "Who carries the heavy bags?", "o": ["The speaker", "The seller", "The mother"], "a": "The speaker"}, {"q": "What do they drink at the small stall?", "o": ["Green tea", "Milk", "Juice"], "a": "Green tea"}, {"q": "What does the bazaar teach the speaker?", "o": ["Patience and kindness", "Maths", "Cooking"], "a": "Patience and kindness"}]};d.s3=["Why do some people prefer markets to supermarkets?", "How has shopping changed in your country in recent years?", "Do you think traditional markets will disappear? Why or why not?", "What are the advantages and disadvantages of shopping online?"];const have=new Set(d.v.map(w=>w[0]));d.v=d.v.concat([["vendor", "sotuvchi", "The vendor sells fruit."], ["produce", "qishloq mahsuloti", "Fresh produce is cheap."], ["handmade", "qo‘lda yasalgan", "This bowl is handmade."], ["souvenir", "esdalik", "I bought a souvenir."], ["ceramics", "kulolchilik buyumlari", "The ceramics are blue."], ["fabric", "mato", "This fabric is soft."], ["haggle", "savdolashmoq", "Do not haggle too long."], ["authentic", "haqiqiy", "It is an authentic dish."], ["aroma", "xushbo‘y hid", "The aroma of bread is lovely."], ["wholesale", "ulgurji", "Wholesale prices are lower."]].filter(w=>!have.has(w[0])))}
{const A={2:{r:{t:"A. The Station\nThe central station is busy an hour before departure. Passengers carry suitcases and check the big board for their platform number. A loud voice announces every delay and every arrival. Children run along the platform while their parents hold the tickets. Vendors sell tea and hot samsa to the tired travellers.\n\nB. A Brief History of Railways\nThe first steam trains appeared in Britain in the early nineteenth century. They carried coal and soon began to carry people as well. Railways quickly spread across Europe and the rest of the world. In Central Asia, the first lines connected the great trading cities in the 1880s. Today, fast electric trains make the same journey in a few hours.\n\nC. Inside the Carriage\nEach carriage has rows of soft seats and large windows. A conductor walks through and checks every ticket politely. Some passengers read, others sleep or eat sandwiches. A small table by the window holds tea and fruit. At night, the seats can be turned into narrow beds.\n\nD. The View from the Window\nThe train crosses wide fields and passes through a long tunnel. For a few seconds everything is dark, then bright again. Far away, mountains appear with snow on their tops. Shepherds wave from the hills as the train goes by. Many travellers take photos of the changing landscape.\n\nE. Making Friends on Board\nLong journeys often start conversations between strangers. A grandmother offers bread and cheese to the children. Two students compare their notes before an exam. A businessman shows photographs of his village to the person next to him. By the end of the trip, many passengers know each other’s names.\n\nF. Why Trains Are Popular\nTrains are safer than cars and more comfortable than buses. They produce less pollution for every passenger they carry. Travellers can walk around, rest and enjoy the scenery. Tickets are also cheaper than air travel on short distances. For these reasons, more people choose the railway every year.\n\nG. Arrival\nAfter six hours the train slows down and enters the new city. Passengers collect their bags and wait by the doors. Taxi drivers shout offers outside the station. Tired but happy, the travellers step onto the platform. Many of them already plan their next journey.",q:[{"q": "Vendors sell food at the station.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The first steam trains appeared in Asia.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The seats can become beds at night.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Shepherds wave to the passengers.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most passengers on the train are tourists.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Train tickets are more expensive than air tickets on short distances.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The journey described takes eight hours.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "A loud voice announces every delay and every ______.", "a": "arrival"}, {"q": "The first railway lines in Central Asia connected great trading ______.", "a": "cities"}, {"q": "A conductor checks every ______ politely.", "a": "ticket"}, {"q": "The train passes through a long ______.", "a": "tunnel"}, {"q": "A grandmother offers bread and ______ to the children.", "a": "cheese"}, {"q": "Trains produce less ______ for every passenger.", "a": "pollution"}]},l:{"s": ["A: Excuse me, which platform does the Bukhara train leave from?", "B: Platform six. It departs at ten forty.", "A: Is it a direct train?", "B: No, you must change at Navoi. The connection takes fifteen minutes.", "A: How much is a ticket in second class?", "B: One hundred and twenty thousand soms.", "A: And is there a restaurant on the train?", "B: No, but a trolley comes round with snacks and tea.", "A: Can I take a large suitcase?", "B: Yes, put it on the shelf above your seat.", "A: Does the train have Wi-Fi?", "B: Not yet, but there are sockets for chargers.", "A: Great. One ticket to Bukhara, please.", "B: Here you are. Have a pleasant journey!"], "q": [{"q": "The Bukhara train leaves from platform ______.", "a": "six"}, {"q": "You must change trains at ______.", "a": "Navoi"}, {"q": "A second-class ticket costs one hundred and ______ thousand soms.", "a": "twenty"}, {"q": "A ______ comes round with snacks and tea.", "a": "trolley"}, {"q": "The suitcase goes on the ______ above your seat.", "a": "shelf"}, {"q": "The train has sockets for ______.", "a": "chargers"}, {"q": "What time does the train depart?", "o": ["10:14", "10:40", "11:40"], "a": "10:40"}, {"q": "How long is the connection at Navoi?", "o": ["Five minutes", "Fifteen minutes", "Fifty minutes"], "a": "Fifteen minutes"}, {"q": "Is there a restaurant on the train?", "o": ["Yes", "No", "Only in first class"], "a": "No"}, {"q": "Does the train have Wi-Fi?", "o": ["Yes", "No, not yet", "Only in first class"], "a": "No, not yet"}]},sh:{"t": "I travel by train to visit my grandparents every summer. The journey takes about five hours, but I never feel bored. I always choose a window seat so that I can watch the fields and the mountains. Before the train leaves, my father buys tea and fresh bread at the station. Then I open my book and read until we pass the first tunnel. Sometimes I talk to other passengers and learn interesting stories about their cities. In the afternoon the conductor checks our tickets and wishes us a pleasant trip. When we arrive, my grandfather is already waiting on the platform with a big smile. He takes my suitcase and tells me that I have grown. We walk home together through the quiet evening streets. For me, the train is not just transport; it is the beginning of the holiday.", "q": [{"q": "How often does the speaker travel by train to the grandparents?", "o": ["Every summer", "Every winter", "Every month"], "a": "Every summer"}, {"q": "How long is the journey?", "o": ["About five hours", "About two hours", "About ten hours"], "a": "About five hours"}, {"q": "Why does the speaker choose a window seat?", "o": ["To watch the fields and mountains", "It is cheaper", "It is quieter"], "a": "To watch the fields and mountains"}, {"q": "What does the father buy at the station?", "o": ["Tea and fresh bread", "Tickets", "Newspapers"], "a": "Tea and fresh bread"}, {"q": "When does the speaker read?", "o": ["Until the first tunnel", "All night", "Never"], "a": "Until the first tunnel"}, {"q": "Who is waiting on the platform?", "o": ["The grandfather", "The father", "A friend"], "a": "The grandfather"}, {"q": "What is the train for the speaker?", "o": ["The beginning of the holiday", "A problem", "A job"], "a": "The beginning of the holiday"}]},v:[["express", "tezyurar poyezd", "We took the express."], ["commuter", "qatnovchi", "Commuters fill the train."], ["fare", "yo‘l haqi", "The fare is low."], ["trolley", "aravacha", "A trolley sells snacks."], ["shelf", "tokcha", "Put it on the shelf."], ["socket", "rozetka", "There is a socket here."], ["scenery", "manzara", "The scenery is lovely."], ["steam", "bug‘", "Steam trains are old."], ["vendor", "sotuvchi", "The vendor sells tea."], ["shepherd", "cho‘pon", "The shepherd waved."]]},3:{r:{t:"A. How We Met\nI met my best friend, Aziz, in the first year of school. We sat at the same desk and shared one pencil. At first we did not talk much because we were both shy. A funny mistake by the teacher made us laugh, and we became friends that day. Since then we have rarely spent a day apart.\n\nB. What Makes a Good Friend\nPsychologists say that real friendship needs trust, honesty and time. A good friend listens without interrupting and gives advice only when asked. He is happy for you when you succeed and stays near when you fail. Such people are rare, so they should be valued. Aziz has all of these qualities.\n\nC. What He Is Like\nAziz is kind, honest and always ready to help. He makes people laugh with his silly jokes. When I am sad, he listens carefully and never judges me. He also keeps every secret I tell him. His loyalty is the thing I admire most.\n\nD. Our Time Together\nEvery Friday we play football in the yard near my house. On weekends we ride bicycles to the river. Sometimes we only sit and talk for hours. Time passes quickly when we are together. We have never been bored in each other’s company.\n\nE. A Difficult Moment\nOnce we argued about a silly game and did not speak for a week. I felt terrible and missed him every day. Finally, he came to my door and said sorry first. I was ashamed because I should have done that. Since then, we always solve problems by talking.\n\nF. Friends in the Digital Age\nToday many young people have hundreds of online friends. However, they often have only two or three real ones. Messages and photos can keep people in touch, but they cannot replace a hug. Aziz and I use our phones to arrange meetings, not to avoid them. We believe that friendship needs face-to-face time.\n\nG. Looking Ahead\nNext year we will go to different universities in different cities. We are a little sad, but we are not afraid. We have promised to call each other every Sunday. During the holidays we will meet and travel together. I am sure that our friendship will last forever.",q:[{"q": "The writer and Aziz shared a pencil in their first year.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Psychologists say that friendship needs only time.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Aziz tells other people the writer’s secrets.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The friends play football every Friday.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Aziz is older than the writer.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The writer has hundreds of online friends.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The friends will study in the same city next year.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "A good friend listens without ______.", "a": "interrupting"}, {"q": "The writer admires Aziz’s ______ most.", "a": "loyalty"}, {"q": "On weekends they ride bicycles to the ______.", "a": "river"}, {"q": "Aziz came to the writer’s ______ and said sorry.", "a": "door"}, {"q": "Online messages cannot replace a ______.", "a": "hug"}, {"q": "They have promised to call each other every ______.", "a": "Sunday"}]},l:{"s": ["A: Hi Dilya, are you free on Saturday?", "B: Yes. Why?", "A: It is Madina’s birthday, and I want to give her a surprise.", "B: What a lovely idea! Where shall we do it?", "A: At my house, at six o’clock. Her mother will bring her at a quarter past six.", "B: Who else is coming?", "A: Eight classmates and her cousin Bobur.", "B: Should I bring something?", "A: Could you make a cake? She loves chocolate.", "B: Of course. I will also bring candles and balloons.", "A: Perfect. I will buy the present, a silver bracelet.", "B: How much will it cost?", "A: About two hundred thousand soms. We can share it.", "B: Great. See you on Saturday!"], "q": [{"q": "The party is on ______.", "a": "Saturday"}, {"q": "Madina’s ______ will bring her to the party.", "a": "mother"}, {"q": "Eight classmates and her cousin ______ are coming.", "a": "Bobur"}, {"q": "Dilya will make a chocolate ______.", "a": "cake"}, {"q": "The present is a silver ______.", "a": "bracelet"}, {"q": "The friends will ______ the cost of the present.", "a": "share"}, {"q": "What time will Madina arrive?", "o": ["6:00", "6:15", "6:45"], "a": "6:15"}, {"q": "Where is the party?", "o": ["At the speaker’s house", "At a café", "At school"], "a": "At the speaker’s house"}, {"q": "How much will the present cost?", "o": ["About 100,000", "About 200,000", "About 300,000"], "a": "About 200,000"}, {"q": "What will Dilya also bring?", "o": ["Candles and balloons", "Flowers", "Juice"], "a": "Candles and balloons"}]},sh:{"t": "My best friend Aziz and I have known each other for eight years. We met at school, and since then we have shared everything. When I feel sad, I call him, and he always finds time to listen. He never laughs at my mistakes; instead, he helps me to correct them. Last month I failed an important exam, and I wanted to give up. Aziz came to my house with a box of sweets and a plan for studying together. We worked every evening for two weeks and I passed the second attempt. That day I understood what a real friend is. A real friend is not the person who makes you laugh the most, but the person who stays when things become difficult. I hope that I can be the same kind of friend for him one day.", "q": [{"q": "How long have they known each other?", "o": ["Eight years", "Two years", "Ten years"], "a": "Eight years"}, {"q": "Where did they meet?", "o": ["At school", "At a camp", "Online"], "a": "At school"}, {"q": "What does Aziz do when the speaker calls?", "o": ["Listens", "Sleeps", "Laughs"], "a": "Listens"}, {"q": "What happened last month?", "o": ["The speaker failed an exam", "The speaker moved house", "The speaker won a prize"], "a": "The speaker failed an exam"}, {"q": "What did Aziz bring?", "o": ["Sweets and a plan", "A gift", "A book"], "a": "Sweets and a plan"}, {"q": "How long did they study together?", "o": ["Two weeks", "Two days", "Two months"], "a": "Two weeks"}, {"q": "Who is a real friend?", "o": ["The person who stays when things are difficult", "The one who makes you laugh most", "The one who lives nearby"], "a": "The person who stays when things are difficult"}]},v:[["bracelet", "bilaguzuk", "A silver bracelet."], ["interrupt", "so‘zini bo‘lmoq", "Do not interrupt me."], ["loyalty", "sadoqat", "I admire his loyalty."], ["admire", "hayrat bilan qaramoq", "I admire her courage."], ["ashamed", "uyalgan", "I felt ashamed."], ["value", "qadrlamoq", "Value your friends."], ["trustworthy", "ishonchli", "He is trustworthy."], ["companionship", "hamrohlik", "I enjoy companionship."], ["lifelong", "umrbod", "A lifelong friend."], ["apology", "uzr", "Accept my apology."]]}};for(const k in A){const d=DATA[k],x=A[k];d.r=x.r;d.l=x.l;d.sh=x.sh;const have=new Set(d.v.map(w=>w[0]));d.v=d.v.concat(x.v.filter(w=>!have.has(w[0])))}const S6={"1": "Do you prefer buying things online or in shops?", "2": "Do you ever feel nervous when you travel?", "3": "Do you prefer one close friend or many friends?", "4": "Do you like surprises?", "5": "Do you often visit a pharmacy?", "6": "What is your favourite kind of weather?"};for(const k in S6)if(DATA[k]&&DATA[k].s1.length<6)DATA[k].s1.push(S6[k])}
{const A={"4": {"r": "A. Getting Ready\nOn Saturday, Madina turns twelve. Her mother wakes up early to bake a chocolate cake. Her father blows up colourful balloons and hangs them in the garden. Madina helps her cousin to put cups and plates on the long table.\n\nB. A Little History\nBirthday celebrations have a long history. The ancient Romans marked the birthdays of their friends with a party. Cakes with candles became popular in Germany in the eighteenth century. People believed that the smoke from the candles carried wishes to the sky.\n\nC. The Guests Arrive\nAt four o’clock the first guests ring the doorbell. Each friend brings a present wrapped in bright paper. Madina’s grandmother arrives last with a big box of sweets. Soon the garden is full of laughter and noise.\n\nD. Games and Music\nThe children play musical chairs and a treasure hunt. Her uncle plays the dutar while everyone sings. Some guests dance on the grass in their socks. A neighbour takes photos of the happy faces.\n\nE. The Presents\nMadina opens each present slowly and carefully. Her cousin gives her a book of fairy tales, and a friend gives her a silver pen. The biggest box contains a small piano from her parents. She thanks everyone with a warm hug.\n\nF. The Cake\nWhen it gets dark, her mother brings the cake with twelve candles. Everyone sings the birthday song. Madina closes her eyes, makes a wish and blows out all the candles. The guests clap and shout with joy.\n\nG. After the Party\nThe guests leave at ten, and the garden becomes quiet. Madina helps her mother to collect plates and cups. She writes in her diary that this was her happiest birthday. Next year she hopes to invite even more friends.", "rq": [{"q": "The ancient Romans marked the birthdays of their friends.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Cakes with candles first became popular in France.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Madina’s parents gave her a small piano.", "o": [ with a blue ______.", "a": "ribbon"}, {"q": "How much is one balloon?", "o": ["1,000", "2,000", "3,000"], "a": "2,000"}, {"q": "On which day is the party?", "o": ["Thursday", "Friday", "Saturday"], "a": "Friday"}, {"q": "What time does the party start?", "o": ["Five", "Six", "Seven"], "a": "Six"}, {"q": "What kind of candles does the customer want?", "o": ["Number candles", "Pink candles", "Small candles"], "a": "Number candles"}], "sh": "Last Friday we celebrated my sister’s twelfth birthday at home. In the morning, my mother baked a huge chocolate cake while my father blew up balloons. I decorated the living room with colourful paper and put a big banner on the wall. At six o’clock the guests arrived, and everybody brought a small present. My sister was very surprised because she did not know about the party. We played games, sang songs and danced until the cake was ready. She made a wish and blew out all twelve candles with one breath. Later, my uncle played the dutar, and the neighbours came to listen. At ten o’clock the guests went home, and we tidied the room together. My sister said that it was the best day of her life. I felt proud because the surprise was my idea.", "sq": [{"q": "Whose birthday was it?", "o": ["The sister’s", "The brother’s", "The mother’s"], "a": "The sister’s"}, {"q": "Who baked the cake?", "o": ["The mother", "The father", "The speaker"], "a": "The mother"}, {"q": "Who put the banner on the wall?", "o": ["The speaker", "The uncle", "The sister"], "a": "The speaker"}, {"q": "When did the guests arrive?", "o": ["Four o’clock", "Six o’clock", "Eight o’clock"], "a": "Six o’clock"}, {"q": "What did the uncle play?", "o": ["The dutar", "The guitar", "The piano"], "a": "The dutar"}, {"q": "When did the guests go home?", "o": ["Eight o’clock", "Ten o’clock", "Midnight"], "a": "Ten o’clock"}, {"q": "Why did the speaker feel proud?", "o": ["The surprise was his or her idea", "He or she won a game", "He or she got a gift"], "a": "The surprise was his or her idea"}], "v": [["banner", "bayroqcha", "A banner hangs on the wall."], ["diary", "kundalik", "I write in my diary."], ["doorbell", "eshik qo‘ng‘irog‘i", "The doorbell rang."], ["fairy tale", "ertak", "She reads fairy tales."], ["anniversary", "yubiley", "It is our anniversary."], ["organise", "tashkil qilmoq", "We organise the party."], ["cheerful", "quvnoq", "He is cheerful."], ["greeting", "tabrik; salom", "A warm greeting."], ["blow up", "shar shishirmoq", "Blow up the balloons."], ["clap", "qarsak chalmoq", "Everyone clapped."]]}, "5": {"r": "A. Feeling Ill\nOn Monday morning Timur woke up with a sore throat and a terrible headache. His forehead felt hot, so his mother took his temperature. It was thirty-nine degrees. She decided to take him to the clinic at once.\n\nB. The Waiting Room\nThe waiting room was full of patients, and the nurse asked everyone to sit quietly. Posters on the wall explained how to wash hands properly. A small boy coughed in the corner while his mother held his hand. Timur read an old magazine for twenty minutes.\n\nC. The Examination\nA doctor finally called Timur’s name. She listened to his chest and looked at his throat with a small light. Then she checked his ears and asked how long he had been coughing. Her calm voice made him feel less afraid.\n\nD. The Diagnosis\nThe doctor said it was a bad cold with a mild fever. She wrote a prescription for syrup and tablets. Timur had to take the medicine twice a day after meals. She also told him to drink lots of water and stay in bed.\n\nE. At the Pharmacy\nOn the way home, Timur’s mother stopped at the pharmacy. The pharmacist explained exactly how to use each medicine. Everything cost fifty thousand soms, including a box of vitamin C. She also advised them to keep the syrup in a cool place.\n\nF. Recovery\nTimur slept a lot and drank tea with honey. His grandmother cooked chicken soup every day. After three days his temperature went down and the cough became weaker. He felt strong enough to go back to school on Friday.\n\nG. Staying Healthy\nSince then, Timur has changed some habits. He washes his hands before meals and sleeps eight hours every night. He eats more fruit and wears warm clothes in winter. He also visits the doctor regularly, even when he feels well.", "rq": [{"q": "Timur’s mother measured his temperature at home.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The doctor used a small light to look at his throat.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Timur had to take the medicine before meals.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The medicine cost fifty thousand soms.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Timur’s sister also became ill.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Timur went back to school after a week.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The doctor advised Timur to play outside.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The nurse asked everyone to sit ______.", "a": "quietly"}, {"q": "The doctor wrote a ______ for syrup and tablets.", "a": "prescription"}, {"q": "The ______ explained exactly how to use each medicine.", "a": "pharmacist"}, {"q": "Timur drank tea with ______.", "a": "honey"}, {"q": "Timur now washes his ______ before meals.", "a": "hands"}, {"q": "He sleeps eight ______ every night.", "a": "hours"}], "ls": ["A: Good morning, City Clinic. How can I help you?", "B: I would like to book an appointment with Doctor Karimova.", "A: What is the problem?", "B: I have had a high temperature and a cough for three days.", "A: I can offer you Thursday at half past nine.", "B: Can I come earlier? I have lessons later.", "A: Let me check. There is a free place at nine.", "B: That is fine. Do I need to bring anything?", "A: Please bring your passport and the previous test results.", "B: Where is the clinic?", "A: On Navoi Street, next to the pharmacy.", "B: What is the fee?", "A: Eighty thousand soms for the first visit.", "B: Thank you. See you on Thursday."], "lq": [{"q": "The patient wants to see Doctor ______.", "a": "Karimova"}, {"q": "The patient has a high temperature and a ______.", "a": "cough"}, {"q": "The earlier appointment is at ______ o’clock.", "a": "nine"}, {"q": "The patient must bring a passport and the previous test ______.", "a": "results"}, {"q": "The clinic is on ______ Street.", "a": "Navoi"}, {"q": "The clinic is next to the ______.", "a": "pharmacy"}, {"q": "How long has the patient been ill?", "o": ["One day", "Three days", "A week"], "a": "Three days"}, {"q": "Which day is the appointment?", "o": ["Tuesday", "Thursday", "Saturday"], "a": "Thursday"}, {"q": "How much is the fee for the first visit?", "o": ["60,000", "80,000", "100,000"], "a": "80,000"}, {"q": "Why does the patient want an earlier time?", "o": ["He or she has lessons later", "The clinic closes early", "He or she is travelling"], "a": "He or she has lessons later"}], "sh": "Last winter I caught a bad cold. I woke up with a sore throat, and my head hurt a lot. My mother measured my temperature, and it was thirty-eight and a half degrees. We went to the clinic, and the doctor listened to my chest carefully. She said that I had a virus and I needed rest, not antibiotics. I had to take syrup twice a day and drink plenty of warm water. For three days I stayed in bed, and my grandmother cooked chicken soup for me. I missed my friends and my lessons, but I felt cared for. On the fourth day my temperature went down, and I could eat normally. Since then I always wear a scarf and wash my hands before meals. Health is the most valuable thing that we have.", "sq": [{"q": "What did the speaker catch?", "o": ["A bad cold", "A broken leg", "An allergy"], "a": "A bad cold"}, {"q": "What was the temperature?", "o": ["Thirty-seven", "Thirty-eight and a half", "Thirty-nine"], "a": "Thirty-eight and a half"}, {"q": "What did the doctor say?", "o": ["Rest was needed, not antibiotics", "An operation was needed", "Nothing was wrong"], "a": "Rest was needed, not antibiotics"}, {"q": "How often did the speaker take syrup?", "o": ["Once a day", "Twice a day", "Four times a day"], "a": "Twice a day"}, {"q": "Who cooked chicken soup?", "o": ["The grandmother", "The mother", "The father"], "a": "The grandmother"}, {"q": "When did the temperature go down?", "o": ["On the second day", "On the fourth day", "After a week"], "a": "On the fourth day"}, {"q": "What does the speaker do now?", "o": ["Wears a scarf and washes hands", "Stays at home", "Takes pills daily"], "a": "Wears a scarf and washes hands"}], "v": [["pharmacist", "dorixonachi", "The pharmacist helped me."], ["virus", "virus", "It is a virus."], ["antibiotic", "antibiotik", "Antibiotics do not cure a cold."], ["recovery", "tuzalish", "His recovery is quick."], ["diagnosis", "tashxis", "The diagnosis is a cold."], ["infection", "infeksiya", "An ear infection."], ["immunity", "immunitet", "Vitamins help immunity."], ["fee", "to‘lov", "The fee is eighty thousand."], ["contagious", "yuqumli", "The flu is contagious."], ["hygiene", "gigiyena", "Good hygiene is important."]]}, "6": {"r": "A. A Grey Morning\nOn Saturday morning, heavy rain falls on the city. Dark clouds cover the sky and the wind shakes the trees. Amir was going to play football with his friends. He looks out of the window and sighs, because the pitch is full of puddles.\n\nB. Why It Rains\nRain begins when warm air rises and cools. Water vapour then turns into tiny drops that form clouds. When the drops become heavy, they fall to the ground as rain. In Uzbekistan most rain falls in spring and autumn.\n\nC. Plans Change\nHis sister suggests staying home and having a family day. Their mother makes hot soup and a big pot of tea. Father brings out an old box of board games from the cupboard. Soon the living room feels warm and cosy.\n\nD. Cooking Together\nEveryone helps in the kitchen, even Amir. He peels the potatoes while his sister mixes the dough for small pies. Father tells jokes and tastes the filling again and again. The smell of baking soon fills the whole flat.\n\nE. Games and Stories\nAfter lunch they play chess, cards and a difficult puzzle with a thousand pieces. Grandfather tells funny stories about rainy days in his childhood. The children laugh so loudly that the neighbours knock on the door. Everybody has put away their phones.\n\nF. The Rain Stops\nIn the afternoon the rain stops and a small rainbow appears. Amir and his sister go outside in their boots and jump in puddles. When they return, their clothes are wet but their faces are happy. The street smells of fresh earth.\n\nG. A Lesson from the Rain\nThat night Amir realises that family time is rare. He decides that rainy days are not so bad. He asks his parents to repeat this day every month. His mother smiles and writes the idea on the calendar.", "rq": [{"q": "Rain begins when warm air rises and cools.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "In Uzbekistan most rain falls in summer.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Amir peeled the potatoes.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The family used their phones all day.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Grandfather lives in another city.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "A small rainbow appeared in the afternoon.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The family decided to repeat the day every week.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Dark ______ cover the sky.", "a": "clouds"}, {"q": "Father brings out an old box of board ______.", "a": "games"}, {"q": "Amir’s sister mixes the ______ for small pies.", "a": "dough"}, {"q": "Amir and his sister jump in ______.", "a": "puddles"}, {"q": "Everybody has put away their ______.", "a": "phones"}, {"q": "Amir asks his parents to repeat this day every ______.", "a": "month"}], "ls": ["A: Hi Bekzod, have you seen the weather forecast for Saturday?", "B: Yes, it will rain all morning, but it should stop around two.", "A: Then the picnic is not possible. Shall we move it to Sunday?", "B: Sunday will be sunny, with a temperature of twenty-five degrees.", "A: Perfect. Where shall we go?", "B: How about the lake near the mountains?", "A: It is a bit far. The bus takes an hour and a half.", "B: I can ask my father to drive us. He has a big car.", "A: Great. What should we bring?", "B: Sandwiches, fruit and a blanket. I will bring a football as well.", "A: I will bring juice and a camera.", "B: Let us meet at nine in front of the library.", "A: Fine. Don’t forget your hat!", "B: I won’t. See you on Sunday."], "lq": [{"q": "On Saturday the rain should stop around ______.", "a": "two"}, {"q": "They will move the picnic to ______.", "a": "Sunday"}, {"q": "On Sunday the temperature will be ______ degrees.", "a": "twenty-five"}, {"q": "The bus takes an hour and a ______.", "a": "half"}, {"q": "Bekzod’s ______ will drive them.", "a": "father"}, {"q": "They will meet in front of the ______.", "a": "library"}, {"q": "Where will they have the picnic?", "o": ["At the lake near the mountains", "In the city park", "By the river"], "a": "At the lake near the mountains"}, {"q": "What time will they meet?", "o": ["Eight", "Nine", "Ten"], "a": "Nine"}, {"q": "Who will bring a football?", "o": ["Bekzod", "The speaker", "Nobody"], "a": "Bekzod"}, {"q": "What will the first speaker bring?", "o": ["Juice and a camera", "Sandwiches", "A blanket"], "a": "Juice and a camera"}], "sh": "Last Saturday it rained heavily, so I could not play football with my friends. At first I felt bored and disappointed. Then my sister suggested that we should cook something together. We made small pies with potatoes and onions. My father put on some quiet music, and my mother sat with a cup of tea. After lunch we played chess and cards, and my grandfather told us funny stories about his childhood. Nobody looked at the phone for hours, which was unusual. In the afternoon the rain stopped, and a rainbow appeared over the roofs. We went outside and jumped in the puddles like small children. When I came back, my clothes were wet, but I was smiling. I realised that a rainy day can be as wonderful as a sunny one.", "sq": [{"q": "Why could the speaker not play football?", "o": ["It rained heavily", "He or she was ill", "The pitch was closed"], "a": "It rained heavily"}, {"q": "What did the sister suggest?", "o": ["Cooking together", "Watching a film", "Going shopping"], "a": "Cooking together"}, {"q": "What did they make?", "o": ["Pies with potatoes and onions", "Plov", "A cake"], "a": "Pies with potatoes and onions"}, {"q": "What did the mother have?", "o": ["A cup of tea", "A book", "A phone"], "a": "A cup of tea"}, {"q": "What did the grandfather tell?", "o": ["Funny stories", "Sad news", "A secret"], "a": "Funny stories"}, {"q": "What appeared in the afternoon?", "o": ["A rainbow", "A storm", "Snow"], "a": "A rainbow"}, {"q": "What did the speaker realise?", "o": ["A rainy day can be as wonderful as a sunny one", "Football is boring", "Cooking is hard"], "a": "A rainy day can be as wonderful as a sunny one"}], "v": [["vapour", "bug‘", "Water vapour rises."], ["downpour", "jala", "A heavy downpour."], ["humid", "nam", "The air is humid."], ["gloomy", "g‘amgin; qorong‘i", "A gloomy sky."], ["soaked", "ho‘l bo‘lib ketgan", "I am soaked."], ["shelter", "boshpana", "We found shelter."], ["damp", "nam", "The towel is damp."], ["rainfall", "yog‘ingarchilik", "Rainfall is low here."], ["mist", "yengil tuman", "Mist covers the hills."], ["sunshine", "quyosh nuri", "I miss the sunshine."]]}};for(const k in A){const d=DATA[k],x=A[k];d.r={t:x.r,q:x.rq};d.l={s:x.ls,q:x.lq};d.sh={t:x.sh,q:x.sq};const have=new Set(d.v.map(w=>w[0]));d.v=d.v.concat(x.v.filter(w=>!have.has(w[0])))}}
